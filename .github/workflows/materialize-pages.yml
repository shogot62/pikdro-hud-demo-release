name: Materialize PikDro Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-pages.yml
      - .pages-src/**

permissions:
  contents: write

concurrency:
  group: pikdro-pages-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Recover and validate landing page payload
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re
          import subprocess

          parts = sorted(Path('.pages-src').glob('index.xz.b64.part*'))
          if not parts:
              raise SystemExit('No payload parts found')

          BASE64_ONLY = re.compile(r'[^A-Za-z0-9+/=]')

          def clean(path: Path) -> str:
              raw = path.read_text(encoding='utf-8-sig', errors='replace')
              cleaned = BASE64_ONLY.sub('', raw)
              invalid = len(raw) - len(cleaned)
              print(f'- {path}: raw={len(raw)} clean={len(cleaned)} removed={invalid}')
              return cleaned

          def decode_lenient(value: str) -> bytes:
              value = value.rstrip('=')
              value += '=' * ((-len(value)) % 4)
              return base64.b64decode(value, validate=False)

          def valid_xz(data: bytes, label: str) -> bool:
              candidate = Path('/tmp/pikdro-index.xz')
              candidate.write_bytes(data)
              result = subprocess.run(
                  ['xz', '--test', str(candidate)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              if result.returncode == 0:
                  print(f'Accepted recovery strategy: {label}')
                  return True
              print(f'Rejected {label}: bytes={len(data)} error={result.stderr.strip()}')
              return False

          print('Payload diagnostics:')
          values = [clean(part) for part in parts]
          recovered = None

          # Standard case: the files are consecutive slices of one Base64 stream.
          for start in range(len(values)):
              joined = ''.join(values[start:])
              try:
                  data = decode_lenient(joined)
              except Exception as exc:
                  print(f'Rejected joined start={start}: {exc}')
              else:
                  if valid_xz(data, f'joined chunks from index {start}'):
                      recovered = data
                      break

          # Fallback: the files were independently Base64-encoded.
          if recovered is None:
              for start in range(len(values)):
                  try:
                      data = b''.join(decode_lenient(value) for value in values[start:])
                  except Exception as exc:
                      print(f'Rejected separate start={start}: {exc}')
                  else:
                      if valid_xz(data, f'separately decoded chunks from index {start}'):
                          recovered = data
                          break

          if recovered is None:
              raise SystemExit('No valid XZ payload could be recovered')

          Path('/tmp/pikdro-index.xz').write_bytes(recovered)
          PY

          xz --decompress --stdout /tmp/pikdro-index.xz > index.html
          test -s index.html
          grep -qi '<!doctype html' index.html
          grep -q 'PikDro HUD' index.html

          cat > robots.txt <<'EOF'
          User-agent: *
          Allow: /

          Sitemap: https://shogot62.github.io/pikdro-hud-demo-release/sitemap.xml
          EOF

          cat > sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://shogot62.github.io/pikdro-hud-demo-release/</loc>
              <lastmod>2026-07-23</lastmod>
            </url>
          </urlset>
          EOF

          cat > favicon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#38bdf8"/><path d="M18 14h21c13 0 20 8 20 18 0 12-8 20-21 20h-8v12H18zm12 10v18h8c7 0 10-3 10-9 0-6-4-9-10-9z" fill="#031019" transform="scale(.78) translate(7 2)"/></svg>
          EOF

          cat > og-image.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">PikDro HUD</title><desc id="desc">配達オファーの単価を自動計算するAndroid向けHUD</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101a"/><stop offset="1" stop-color="#030507"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#67e8f9"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><circle cx="1040" cy="80" r="260" fill="#38bdf8" opacity=".08"/><circle cx="160" cy="620" r="260" fill="#67e8f9" opacity=".06"/><rect x="72" y="72" width="1056" height="486" rx="44" fill="#0b0f16" stroke="#94a3b8" stroke-opacity=".28"/><g transform="translate(114 128)"><rect width="112" height="112" rx="26" fill="#05070a" stroke="#38bdf8" stroke-width="3"/><path d="M26 84V28h31c19 0 32 11 32 27S76 82 57 82H43v2zm17-41v25h13c10 0 16-5 16-13s-6-12-16-12z" fill="url(#accent)"/></g><text x="258" y="184" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="64" font-weight="800">PikDro HUD</text><text x="114" y="305" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="50" font-weight="750">配達オファーの単価を、自動計算。</text><text x="114" y="378" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="29">キロ単価・分単価・時給換算をHUD表示</text><g transform="translate(114 434)"><rect width="254" height="64" rx="32" fill="#38bdf8"/><text x="127" y="42" text-anchor="middle" fill="#03111b" font-family="system-ui,sans-serif" font-size="25" font-weight="800">Android 11以降</text></g><text x="1045" y="497" text-anchor="end" fill="#8a97aa" font-family="system-ui,sans-serif" font-size="23">無料ベータ版</text></svg>
          EOF

          ls -lh index.html robots.txt sitemap.xml favicon.svg og-image.svg

      - name: Commit generated site files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html robots.txt sitemap.xml favicon.svg og-image.svg
          if git diff --cached --quiet; then
            echo "Generated site files are already current."
            exit 0
          fi
          git commit -m "Deploy PikDro HUD landing page"
          git push origin HEAD:main
