# deployment trigger via pull request
# deployment retry 2026-07-22
name: Materialize PikDro Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-pages.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site files
        shell: bash
        run: |
          cat .pages-src/index.xz.b64.part* | base64 -d | xz -d > index.html
          cat > robots.txt <<'EOF'
          User-agent: *
          Allow: /

          Sitemap: https://shogot62.github.io/pikdro-hud-demo-release/sitemap.xml
          EOF
          cat > sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://shogot62.github.io/pikdro-hud-demo-release/</loc>
              <lastmod>2026-07-22</lastmod>
            </url>
          </urlset>
          EOF
          echo '' | base64 -d > favicon.svg
          echo '' | base64 -d > og-image.svg
          rm -rf .pages-src
          rm -f .github/workflows/materialize-pages.yml
      - name: Commit deployed site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy PikDro HUD landing page"
          git push
