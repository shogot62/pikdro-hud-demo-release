name: Materialize PikDro Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-pages.yml
      - .pages-src/**

permissions:
  contents: write

concurrency:
  group: pikdro-pages-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Recover and validate landing page payload
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import base64
          import subprocess
          import sys

          parts = sorted(Path('.pages-src').glob('index.xz.b64.part*'))
          if not parts:
              raise SystemExit('No payload parts found')

          print('Payload parts:')
          for part in parts:
              print(f'- {part} ({part.stat().st_size} bytes)')

          def clean(text: str) -> str:
              return ''.join(text.split())

          def padded(value: str) -> str:
              return value + ('=' * ((-len(value)) % 4))

          def valid_xz(data: bytes, label: str) -> bool:
              candidate = Path('/tmp/pikdro-index.xz')
              candidate.write_bytes(data)
              result = subprocess.run(
                  ['xz', '--test', str(candidate)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              if result.returncode == 0:
                  print(f'Accepted recovery strategy: {label}')
                  return True
              print(f'Rejected {label}: {result.stderr.strip()}')
              return False

          recovered = None

          # Try progressively dropping stale leading chunks. This handles a
          # previous payload generation being left in part00.
          for start in range(len(parts)):
              selected = parts[start:]

              # Strategy A: chunks are slices of one Base64 string.
              joined = ''.join(clean(p.read_text(encoding='utf-8')) for p in selected)
              try:
                  data = base64.b64decode(padded(joined), validate=True)
              except Exception as exc:
                  print(f'Rejected joined start={start}: {exc}')
              else:
                  if valid_xz(data, f'joined chunks from index {start}'):
                      recovered = data
                      break

              # Strategy B: each chunk was encoded independently.
              decoded_parts = []
              try:
                  for p in selected:
                      value = clean(p.read_text(encoding='utf-8'))
                      decoded_parts.append(base64.b64decode(padded(value), validate=True))
                  data = b''.join(decoded_parts)
              except Exception as exc:
                  print(f'Rejected separate start={start}: {exc}')
              else:
                  if valid_xz(data, f'separately decoded chunks from index {start}'):
                      recovered = data
                      break

          if recovered is None:
              raise SystemExit('No valid XZ payload could be recovered from the staged chunks')

          Path('/tmp/pikdro-index.xz').write_bytes(recovered)
          PY

          xz --decompress --stdout /tmp/pikdro-index.xz > index.html
          test -s index.html
          grep -qi '<!doctype html' index.html
          grep -q 'PikDro HUD' index.html

          cat > robots.txt <<'EOF'
          User-agent: *
          Allow: /

          Sitemap: https://shogot62.github.io/pikdro-hud-demo-release/sitemap.xml
          EOF

          cat > sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://shogot62.github.io/pikdro-hud-demo-release/</loc>
              <lastmod>2026-07-22</lastmod>
            </url>
          </urlset>
          EOF

          cat > favicon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="16" fill="#38bdf8"/>
            <path d="M18 14h21c13 0 20 8 20 18 0 12-8 20-25 20h-8v12H18zm12 10v18h8c7 0 10-3 10-9 0-6-4-9-10-9z" fill="#031019" transform="scale(.78) translate(7 2)"/>
          </svg>
          EOF

          cat > og-image.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
            <title id="title">PikDro HUD</title>
            <desc id="desc">配達オファーの単価を自動計算するAndroid向け判断支援HUD</desc>
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#07101a"/>
                <stop offset="1" stop-color="#020407"/>
              </linearGradient>
              <radialGradient id="glow">
                <stop stop-color="#38bdf8" stop-opacity=".28"/>
                <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <rect width="1200" height="630" fill="url(#bg)"/>
            <circle cx="910" cy="140" r="390" fill="url(#glow)"/>
            <g transform="translate(86 82)">
              <rect width="92" height="92" rx="24" fill="#38bdf8"/>
              <path d="M28 24h32c21 0 31 12 31 29 0 19-13 31-34 31H45v21H28zm17 15v30h12c11 0 17-5 17-15 0-10-6-15-17-15z" fill="#031019" transform="scale(.75) translate(10 3)"/>
            </g>
            <text x="206" y="143" fill="#f8fafc" font-size="52" font-family="system-ui,sans-serif" font-weight="800">PikDro HUD</text>
            <text x="88" y="290" fill="#f8fafc" font-size="68" font-family="system-ui,sans-serif" font-weight="800">オファー判断を、もっと軽く。</text>
            <text x="90" y="365" fill="#cbd5e1" font-size="32" font-family="system-ui,sans-serif">キロ単価・分単価・時給換算をHUD表示</text>
            <g transform="translate(90 440)">
              <rect width="680" height="86" rx="22" fill="#0b0f16" stroke="#38bdf8" stroke-opacity=".45"/>
              <text x="34" y="55" fill="#67e8f9" font-size="29" font-family="system-ui,sans-serif" font-weight="700">Android 11以降｜無料ベータ版</text>
            </g>
          </svg>
          EOF

          echo "Generated files:"
          ls -lh index.html robots.txt sitemap.xml favicon.svg og-image.svg

      - name: Commit generated site files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html robots.txt sitemap.xml favicon.svg og-image.svg

          if git diff --cached --quiet; then
            echo "Generated site files are already current."
            exit 0
          fi

          git commit -m "Deploy PikDro HUD landing page"
          git push origin HEAD:main
